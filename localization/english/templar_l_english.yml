 templar_recruit_knights_decision_desc:0 "Only the most disciplined and reputable brethren may take up the lance as full Knights of the Temple."
 templar_recruit_knights_decision_tooltip:0 "Recruit a Knights of the Temple regiment"
 templar_recruit_knights_decision_confirm:0 "Admit them to the lance"
 templar_recruit_turcopoles_decision:0 "Hire Turcopoles"
 templar_recruit_turcopoles_decision_desc:0 "Local horse-archers, often converts or allies of the faith, can be hired to scout and skirmish for the Order's commanderies."
 templar_recruit_turcopoles_decision_tooltip:0 "Recruit a Turcopoles regiment"
 templar_recruit_turcopoles_decision_confirm:0 "Hire the riders"
 templar_accept_donations_decision:0 "Gather Faithful Donations"
 templar_accept_donations_decision_desc:0 "Appeal to sympathetic rulers, clergy, and pilgrims for support."
 templar_accept_donations_decision_tooltip:0 "Gain Gold and Piety from the faithful"
 templar_accept_donations_decision_confirm:0 "Receive the alms"
 templar_consecrate_fallen_decision:0 "Consecrate Fallen Brothers"
 templar_consecrate_fallen_decision_desc:0 "Honor those who died in service and renew the living brethren's purpose."
 templar_consecrate_fallen_decision_tooltip:0 "Gain Piety, Zeal, and a military blessing"
 templar_consecrate_fallen_decision_confirm:0 "Remember their names"
 templar_bless_army_decision:0 "Bless the Order's Army"
 templar_bless_army_decision_desc:0 "Prepare the host for holy service with prayer, fasting, and solemn blessing."
 templar_bless_army_decision_tooltip:0 "Temporarily improve battlefield performance"
 templar_bless_army_decision_confirm:0 "Bless the banners"
 templar_search_relics_decision:0 "Search for Relics"
 templar_search_relics_decision_desc:0 "Fund an expedition to investigate rumors of a sacred relic."
 templar_search_relics_decision_tooltip:0 "Begin a risky relic expedition"
 templar_search_relics_decision_confirm:0 "Dispatch the expedition"
 templar_purge_corruption_decision:0 "Purge Corruption"
 templar_purge_corruption_decision_desc:0 "Investigate broken vows, stolen funds, and abuses within the brotherhood."
 templar_purge_corruption_decision_tooltip:0 "Choose a merciful or harsh reform"
 templar_purge_corruption_decision_confirm:0 "Open the inquiry"
 templar_recruit_veteran_decision:0 "Recruit a Veteran Commander"
 templar_recruit_veteran_decision_desc:0 "Offer a respected campaigner a place among the brethren."
 templar_recruit_veteran_decision_tooltip:0 "Recruit an experienced martial courtier"
 templar_recruit_veteran_decision_confirm:0 "Offer admission"

 templar_request_donation_interaction:0 "Request a Donation"
 templar_request_donation_interaction_desc:0 "Ask this ruler to support the Order's defense of the faithful."
 templar_request_donation_interaction_notification:0 "[actor.GetShortUIName|U] asks [recipient.GetShortUIName] to make a donation to the Order."
 templar_request_endorsement_interaction:0 "Request Religious Endorsement"
 templar_request_endorsement_interaction_desc:0 "Ask the Head of Faith to publicly endorse the Order."
 templar_request_endorsement_interaction_notification:0 "[actor.GetShortUIName|U] asks [recipient.GetShortUIName] to endorse the Order's mission."
 templar_request_commandery_charter_interaction:0 "Request Commandery Charter"
 templar_request_commandery_charter_interaction_desc:0 "Ask this ruler to recognize and endow a new commandery. No landed title changes hands."
