 templar_rank_renowned_modifier_desc:0 "The Order's banners are recognized across several realms."
 templar_rank_guardian_modifier:0 "Guardian of the Faith"
 templar_rank_guardian_modifier_desc:0 "The faithful look to the Order for protection."
 templar_rank_legendary_modifier:0 "Legendary Order"
 templar_rank_legendary_modifier_desc:0 "The Order's deeds have become the stuff of chronicles."
 templar_rank_shield_modifier:0 "Shield of the Faith"
 templar_rank_shield_modifier_desc:0 "The Order stands as the foremost military defender of its faith."

