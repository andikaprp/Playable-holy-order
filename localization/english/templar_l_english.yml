 found_templar_holy_order_decision:0 "Found the Holy Order of the Temple"
 found_templar_holy_order_decision_desc:0 "I will reorganize my realm under the Rule of the Temple, adopt Holy Order governance, and lead this military brotherhood as Grand Master, devoted to the defense of Christian pilgrims and the faithful. My lands and vassals remain under my rule as the Order's domain."
