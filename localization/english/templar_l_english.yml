 found_templar_holy_order_decision_confirm:0 "Become Grand Master"

 founded_holy_order_modifier:0 "Founder of the Holy Order"
 founded_holy_order_modifier_desc:0 "You established this Holy Order and set it upon the path of righteous service."
 templar_commandery_domain_administration_modifier:0 "Commandery Administration"
 templar_commandery_domain_administration_modifier_desc:0 "Leased commanderies contribute to the Order's administration and revenue."
 templar_commandery_operating_rights_modifier:0 "Commandery Operating Rights"
 templar_commandery_operating_rights_modifier_desc:0 "The right to operate a commandery here improves standing among the local faithful."
 templar_bank_of_the_temple_modifier:0 "Bank of the Temple"
 templar_bank_of_the_temple_modifier_desc:0 "The Order's banking operations generate a steady flow of income."
 templar_reprisal_modifier:0 "Order Reprisal"
 templar_reprisal_modifier_desc:0 "The Temple's bankers have moved against you for your unpaid debts, disrupting trade and raising costs."

 templar_hold_chapter_decision:0 "Convene the General Chapter"
