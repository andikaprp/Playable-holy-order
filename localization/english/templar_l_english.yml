 templar_interaction_accept:0 "The faithful shall be defended"
 templar_interaction_reject:0 "I cannot support this"

 templar_order.0001.t:0 "State of the Order"
 templar_order.0001.desc:0 "Discipline: [ROOT.Char.MakeScope.Var('templar_discipline').GetValue|0]/100\nZeal: [ROOT.Char.MakeScope.Var('templar_zeal').GetValue|0]/100\nReputation: [ROOT.Char.MakeScope.Var('templar_reputation').GetValue|0]/100\nCommanderies: [ROOT.Char.MakeScope.Var('templar_commanderies').GetValue|0]/[ROOT.Char.MakeScope.Var('templar_commandery_limit').GetValue|0]\nOrder Rank: [ROOT.Char.MakeScope.Var('templar_rank').GetValue|0]/5"
 templar_order.0001.a:0 "The Rule guides us"
 templar_order.0002.t:0 "The Commandery Register"
 templar_order.0002.desc:0 "Our network extends across the realms of faithful patrons. The register lists each house's current level and Loyalty; contact its ruler to upgrade or support it."
 templar_order.0002.a:0 "[templar_commandery_1.GetNameNoTier]: Level [templar_commandery_1.MakeScope.Var('templar_commandery_level').GetValue|0], Loyalty [templar_commandery_1.MakeScope.Var('templar_commandery_loyalty').GetValue|0]"
 templar_order.0002.b:0 "[templar_commandery_2.GetNameNoTier]: Level [templar_commandery_2.MakeScope.Var('templar_commandery_level').GetValue|0], Loyalty [templar_commandery_2.MakeScope.Var('templar_commandery_loyalty').GetValue|0]"
 templar_order.0002.c:0 "[templar_commandery_3.GetNameNoTier]: Level [templar_commandery_3.MakeScope.Var('templar_commandery_level').GetValue|0], Loyalty [templar_commandery_3.MakeScope.Var('templar_commandery_loyalty').GetValue|0]"
 templar_order.0002.d:0 "[templar_commandery_4.GetNameNoTier]: Level [templar_commandery_4.MakeScope.Var('templar_commandery_level').GetValue|0], Loyalty [templar_commandery_4.MakeScope.Var('templar_commandery_loyalty').GetValue|0]"
 templar_order.0002.e:0 "[templar_commandery_5.GetNameNoTier]: Level [templar_commandery_5.MakeScope.Var('templar_commandery_level').GetValue|0], Loyalty [templar_commandery_5.MakeScope.Var('templar_commandery_loyalty').GetValue|0]"
 templar_order.0002.f:0 "Close the register"
 templar_order.0101.t:0 "A Chapter of Reform"
 templar_order.0101.desc:0 "The senior brethren expose lax practices and agree upon a stricter observance of the Rule."
 templar_order.0101.a:0 "Discipline is our strength"
 templar_order.0102.t:0 "A Chapter of Renewal"
 templar_order.0102.desc:0 "Prayer and testimony rekindle the brotherhood's devotion to its sacred mission."
 templar_order.0102.a:0 "Let zeal fill every heart"
 templar_order.0103.t:0 "Generous Patrons"
 templar_order.0103.desc:0 "Impressed by the assembled chapter, faithful patrons fill the Order's treasury."
 templar_order.0103.a:0 "Their gifts will serve the faith"
 templar_order.0104.t:0 "A Chapter Divided"
 templar_order.0104.desc:0 "Old grievances erupt in the chapter hall, leaving damaged trust and an expensive settlement."
 templar_order.0104.a:0 "We must endure this discord"
 templar_order.0200.t:0 "Rumors of a Relic"
 templar_order.0200.desc:0 "Our agents have traced an old pilgrim's account to a dangerous road and a forgotten shrine."
 templar_order.0200.a:0 "Follow every clue"
 templar_order.0201.t:0 "The Relic Recovered"
 templar_order.0201.desc:0 "The expedition returns in triumph bearing an object accepted by learned clergy as genuine."
 templar_order.0201.a:0 "Guard it well"
 templar_order.0202.t:0 "A Costly Expedition"
 templar_order.0202.desc:0 "The search finds no relic, and its leader returns wounded, yet the brethren admire the sacrifice."
 templar_order.0202.a:0 "Suffering can strengthen faith"
 templar_order.0203.t:0 "The False Relic"
 templar_order.0203.desc:0 "The supposed relic is exposed as a clever forgery. Some treasure is recovered, but our standing suffers."
 templar_order.0203.a:0 "Destroy the fraud"
 templar_order.0300.t:0 "Corruption Among the Brethren"
 templar_order.0300.desc:0 "The inquiry uncovers diverted donations and repeated breaches of the Rule."
 templar_order.0300.a:0 "Correct them with mercy"
 templar_order.0300.b:0 "Make an example of them"
 templar_order.0400.t:0 "A Veteran Seeks the Mantle"
 templar_order.0400.desc:0 "An experienced warrior offers sword and counsel in exchange for admission to the brotherhood."
 templar_order.0400.a:0 "Welcome, brother"
 templar_order.1000.t:0 "Brothers Break Their Vows"
 templar_order.1000.desc:0 "Several brethren have ignored the Rule and brought shame upon the Order."
 templar_order.1000.a:0 "Pay restitution and counsel them"
 templar_order.1000.b:0 "Punish them publicly"
 templar_order.1001.t:0 "A Noble Joins the Order"
 templar_order.1001.desc:0 "A noble admirer takes vows and brings a generous offering to the common treasury."
 templar_order.1001.a:0 "Receive the new brother"
 templar_order.1002.t:0 "Heretics Discovered"
 templar_order.1002.desc:0 "Our scouts uncover a hidden congregation hostile to the local faithful."
 templar_order.1002.a:0 "Move against them"
 templar_order.1002.b:0 "Report them to the local ruler"
 templar_order.1003.t:0 "A Famous Knight Seeks Admission"
 templar_order.1003.desc:0 "A renowned mounted warrior asks to exchange worldly ambition for service beneath our banner."
 templar_order.1003.a:0 "Let the knight take vows"

 templar_commandery_small_modifier:0 "Small Chapters"
 templar_commandery_small_modifier_desc:0 "The Order maintains modest leased houses that provide income, recruits, and supplies."
 templar_commandery_medium_modifier:0 "Commanderies"
 templar_commandery_medium_modifier_desc:0 "Developed commanderies support knights and reduce the cost of maintaining the host."
 templar_commandery_headquarters_modifier:0 "Regional Headquarters"
 templar_commandery_headquarters_modifier_desc:0 "Major regional houses coordinate elite troops, commanders, and supply depots."
 templar_commandery_loyal_modifier:0 "Loyal Commanderies"
 templar_commandery_loyal_modifier_desc:0 "Strong relations with patrons improve donations and revenue."
 templar_commandery_disloyal_modifier:0 "Disloyal Commanderies"
 templar_commandery_disloyal_modifier_desc:0 "Tense relations with patrons disrupt revenue and military upkeep."
 templar_upgrade_barracks_modifier:0 "Commandery Barracks"
 templar_upgrade_barracks_modifier_desc:0 "Dedicated barracks drill heavy infantry and the Order's knights."
 templar_upgrade_stables_modifier:0 "Commandery Stables"
 templar_upgrade_stables_modifier_desc:0 "Warhorses and trained grooms improve the mounted arm."
 templar_upgrade_hospice_modifier:0 "Pilgrim Hospices"
 templar_upgrade_hospice_modifier_desc:0 "Hospices shelter pilgrims, attract donations, and strengthen the Order's reputation."
 templar_upgrade_chapel_modifier:0 "Commandery Chapels"
 templar_upgrade_chapel_modifier_desc:0 "Chapels sustain the spiritual life of the scattered brethren."
 templar_upgrade_armory_modifier:0 "Commandery Armories"
 templar_upgrade_armory_modifier_desc:0 "Regional stores make equipment cheaper to recruit and maintain."
 templar_upgrade_library_modifier:0 "Commandery Libraries"
 templar_upgrade_library_modifier_desc:0 "Books and learned brothers support study throughout the Order."
 templar_defending_commanderies_modifier:0 "Defending the Commanderies"
 templar_defending_commanderies_modifier_desc:0 "The Order has pledged its host to defend threatened patrons and leased houses."
 templar_commandery_small_county_modifier:0 "Templar Small Chapter"
 templar_commandery_small_county_modifier_desc:0 "A castle or temple here hosts a small chapter of the Order while remaining under its original ruler."
 templar_commandery_medium_county_modifier:0 "Templar Commandery"
 templar_commandery_medium_county_modifier_desc:0 "A developed commandery supports local control, growth, and military recruitment."
 templar_commandery_headquarters_county_modifier:0 "Templar Regional Headquarters"
 templar_commandery_headquarters_county_modifier_desc:0 "This important leased house is a regional center of the Order."
 templar_hospice_county_modifier:0 "Templar Pilgrim Hospice"
 templar_hospice_county_modifier_desc:0 "The Order shelters travelers and supports local prosperity."

 templar_upgrade_commandery_interaction:0 "Upgrade Commandery"
 templar_upgrade_commandery_interaction_desc:0 "Invest in a selected leased house. Two improvements raise it to a Commandery; four create a Regional Headquarters.\n\nLevel: [target.MakeScope.Var('templar_commandery_level').GetValue|0]/3\nLoyalty: [target.MakeScope.Var('templar_commandery_loyalty').GetValue|0]/100"
 templar_upgrade_commandery_interaction_notification:0 "[actor.GetShortUIName|U] invests in the Order's commandery at [target.GetNameNoTier]."
 templar_upgrade_barracks_option:0 "Build Barracks"
 templar_upgrade_stables_option:0 "Build Stables"
 templar_upgrade_hospice_option:0 "Build Pilgrim Hospice"
 templar_upgrade_chapel_option:0 "Build Chapel"
 templar_upgrade_armory_option:0 "Build Armory"
 templar_upgrade_library_option:0 "Build Library"
 templar_support_commandery_patron_interaction:0 "Support Commandery Patron"
 templar_support_commandery_patron_interaction_desc:0 "Donate funds to the ruler hosting this commandery.\n\nCurrent Loyalty: [target.MakeScope.Var('templar_commandery_loyalty').GetValue|0]/100"
 templar_support_commandery_patron_interaction_notification:0 "[actor.GetShortUIName|U] provides aid to [recipient.GetShortUIName] through the commandery at [target.GetNameNoTier]."

 templar_operate_as_bank_decision:0 "Open the Bank of the Temple"
 templar_operate_as_bank_decision_desc:0 "The Order's reputation and reach are sufficient to begin operating as a bank, accepting deposits and issuing loans to trusted rulers."
 templar_operate_as_bank_decision_tooltip:0 "Become a Banker and gain the Bank of the Temple income modifier"
 templar_operate_as_bank_decision_confirm:0 "Open the coffers"
 templar_review_bank_clients_decision:0 "Review Bank Ledger"
 templar_review_bank_clients_decision_desc:0 "Review the Order's depositors and debtors."
 templar_review_bank_clients_decision_tooltip:0 "Open the bank ledger"
 templar_review_bank_clients_decision_confirm:0 "Open the ledger"
 borrow_from_holy_order_decision:0 "Borrow from a Holy Order"
 borrow_from_holy_order_decision_desc:0 "A Holy Order of my faith operates a bank. I could ask them for a loan to ease my treasury's troubles."
 borrow_from_holy_order_decision_tooltip:0 "Request a loan from an active Holy Order bank"
 borrow_from_holy_order_decision_confirm:0 "Send the request"

 send_to_holy_order_interaction:0 "Deposit Funds with the Order"
 send_to_holy_order_interaction_desc:0 "Place 250 Gold in trust with the Order's bank, to be withdrawn later at need."
 send_to_holy_order_interaction_notification:0 "[actor.GetShortUIName|U] deposits funds with [recipient.GetShortUIName]'s bank."
 withdraw_templar_deposit_interaction:0 "Withdraw Deposit"
 withdraw_templar_deposit_interaction_desc:0 "Withdraw my funds held in trust with this bank."
 withdraw_templar_deposit_interaction_notification:0 "[actor.GetShortUIName|U] withdraws a deposit from [recipient.GetShortUIName]'s bank."

 templar_defend_commanderies_decision:0 "Defend Our Commanderies"
 templar_defend_commanderies_decision_desc:0 "A patron of the Order is at war with a hostile faith. I will pledge the brethren to the defense of our houses and their protectors."
 templar_defend_commanderies_decision_tooltip:0 "Gain military bonuses and Loyalty with threatened commanderies"
 templar_defend_commanderies_decision_confirm:0 "Raise the sacred banner"

 templar_order.0600.t:0 "A Request for a Loan"
 templar_order.0600.desc:0 "[templar_borrower.GetTitledFirstName] has come to the Order asking for a loan against their treasury's troubles."
 templar_order.0600.a:0 "Grant a generous loan of [ROOT.Char.MakeScope.Var('templar_loan_offer_amount').GetValue|0] Gold"
 templar_order.0600.b:0 "Grant a modest loan of 100 Gold"
 templar_order.0600.c:0 "Refuse the request"
 templar_order.0601.t:0 "A Debt Comes Due"
 templar_order.0601.desc:0 "The Order's bankers remind you that you owe [templar_lender.GetShortUINameNoTooltip] [ROOT.Char.MakeScope.Var('templar_loan_amount_owed').GetValue|0] Gold."
 templar_order.0601.a:0 "Repay the debt in full"
 templar_order.0601.b:0 "Ask for more time"
